<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LearnFlow- Register</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <h1>LearnFlow</h1>

        <p>Create your learning account</p>
      </div>

      <h2>Create Account</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <p class="message">
              {{ message }}
            </p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="input-group">
          <label for="full_name">
            Full Name
          </label>

          <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="input-group">
          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>

        <button
          type="submit"
          class="main-button"
        >
          Create Account
        </button>
      </form>

      <p class="bottom-text">
        Already have an account?

        <a href="{{ url_for('login') }}">
          Login
        </a>
      </p>
    </div>
  </div>
  <footer class="site-footer">
    <p>Crafted by <strong>Sayed Arsalan Zaheer</strong></p>
</footer>
</body>
</html>
